name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Exercise startup bootstrap tests
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -v

      - name: Check for common secret file names
        run: python3 scripts/check_tracked_secrets.py

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob("{.github,components.d,plugins.d}/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'
